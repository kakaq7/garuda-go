{% extends "base.html" %}
{% block title %}Login — SIPPS Indonesia{% endblock %}
{% block content %}<section class="auth-wrap"><div class="auth-card"><span class="eyebrow">SELAMAT DATANG</span><h1>Login ke SIPPS.</h1><p>Login untuk berkontribusi pada data pembinaan sepakbola Indonesia.</p><form method="post"><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><div class="password-row"><a class="text-link" href="{{url_for('forgot_password')}}">Lupa password?</a></div><button class="btn full" type="submit">Login →</button></form><p class="auth-foot">Belum punya akun? <a href="{{url_for('register')}}">Daftar sekarang</a></p></div></section>{% endblock %}
