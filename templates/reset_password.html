{% extends "base.html" %}
{% block title %}Buat Password Baru — SIPPS Indonesia{% endblock %}
{% block content %}<section class="auth-wrap"><div class="auth-card"><span class="eyebrow">PEMULIHAN AKUN</span><h1>Buat password baru.</h1><p>Masukkan password baru Anda. Tautan pemulihan hanya dapat digunakan melalui email reset dari SIPPS.</p><div id="reset-message" class="notice" style="display:none"></div><form id="reset-form"><label>Password baru<input id="new-password" type="password" minlength="8" required autocomplete="new-password"></label><label>Ulangi password<input id="confirm-password" type="password" minlength="8" required autocomplete="new-password"></label><button class="btn full" type="submit">Simpan password →</button></form><p class="auth-foot"><a href="{{url_for('login')}}">Kembali ke Login</a></p></div></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = window.supabase.createClient({{ supabase_url|tojson }}, {{ supabase_key|tojson }});
const form = document.getElementById('reset-form');
const message = document.getElementById('reset-message');
function showMessage(text, kind='') { message.textContent=text; message.className='notice '+kind; message.style.display='block'; }
(async () => {
  const hash = new URLSearchParams(window.location.hash.substring(1));
  const accessToken = hash.get('access_token');
  const refreshToken = hash.get('refresh_token');
  if (!accessToken || !refreshToken) { showMessage('Tautan reset password tidak valid atau sudah kedaluwarsa. Silakan minta tautan baru.', 'warning'); form.style.display='none'; return; }
  const { error } = await supabaseClient.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
  if (error) { showMessage('Tautan reset password tidak valid atau sudah kedaluwarsa. Silakan minta tautan baru.', 'warning'); form.style.display='none'; }
})();
form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const password = document.getElementById('new-password').value;
  const confirm = document.getElementById('confirm-password').value;
  if (password.length < 8) return showMessage('Password minimal 8 karakter.', 'warning');
  if (password !== confirm) return showMessage('Konfirmasi password tidak sama.', 'warning');
  const { error } = await supabaseClient.auth.updateUser({ password });
  if (error) return showMessage('Password gagal diperbarui. Silakan minta tautan reset baru.', 'warning');
  showMessage('Password berhasil diperbarui. Anda dapat login menggunakan password baru.', 'success');
  form.style.display='none';
  window.history.replaceState({}, document.title, window.location.pathname);
});
</script>{% endblock %}
